name: Build AfuRemote

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Install Gradle & generate wrapper
        run: |
          GRADLE_VERSION="9.6.0"
          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          export PATH="/tmp/gradle-${GRADLE_VERSION}/bin:$PATH"
          gradle wrapper --gradle-version ${GRADLE_VERSION} --distribution-type bin
          chmod +x gradlew
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests + debug APK
        run: ./gradlew test assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: AfuRemote-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AfuRemote-debug
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install e2e crypto helper dependency
        run: pip install cryptography
      - name: Emulator e2e (TV + phone roles)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/e2e.sh apks/app-debug.apk
      - name: Upload e2e evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AfuRemote-e2e
          path: e2e-out/
          retention-days: 14
